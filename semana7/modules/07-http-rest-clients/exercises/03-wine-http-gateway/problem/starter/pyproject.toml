[project]
name = "wine-http-gateway-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4,<2.0",
    "pydantic>=2.10,<3.0",
    "requests>=2.32,<3.0",
    "scikit-learn>=1.5,<2.0",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.40,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_ui"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
